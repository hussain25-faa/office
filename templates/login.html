{% extends "base.html" %}
{% block title %}Sign In - Business ERP Enterprise{% endblock %}

{% block content %}
<div class="login-card mx-auto">
  <div class="text-center mb-4">
    <div class="brand-mark mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">B</div>
    <h2 class="fw-bold mb-1" style="font-family: 'Manrope', sans-serif;">Business<span style="color:var(--accent);">ERP</span></h2>
    <p class="text-muted small">Sign in to your enterprise management portal</p>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label text-dark fw-bold">Username</label>
      <input class="form-control" name="username" placeholder="Enter your username or email" required autocomplete="username" autofocus>
    </div>

    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label text-dark fw-bold mb-0">Password</label>
      </div>
      <input class="form-control mt-1" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button class="btn btn-primary w-100 py-2 fs-6 mb-3" type="submit">
      Sign In to Workspace
    </button>
  </form>

  <div class="text-center pt-3 border-top mt-2">
    <small class="text-muted">
      Authorized personnel only • Protected by BusinessOS Security
    </small>
  </div>
</div>
{% endblock %}
